title: '{{abilities_title}}'
size: 5
fill:
  enabled: true
  material: magenta_stained_glass_pane
items:
  back:
    material: arrow
    pos: 4,0
    display_name: '<light_purple><bold>{{back}}</bold>'
    lore:
      - '<gray>{{back_click}}'
templates:
  locked_ability:
    material: gray_dye
    display_name: '<light_purple>{name}'
    lore:
      - '<white>{{description}}:'
      - text: '{desc}'
        wrap: true
        wrap_indent: '  '
        style: '<gray>'
      - ' '
      - text: '{{unlocked_at}}'
        styles:
          1: '<gray>'
          2: '<dark_aqua>'
      - ' '
      - '<dark_purple>{{locked}}'
  locked_mana_ability:
    pos: 2,4
    material: purple_dye
    display_name: '<light_purple>{name}'
    lore:
      - '<white>{{description}}:'
      - text: '{desc}'
        wrap: true
        wrap_indent: '  '
        styles:
          0: '<gray>'
          1: '<yellow>'
      - ' '
      - text: '{{unlocked_at}}'
        styles:
          1: '<gray>'
          2: '<dark_aqua>'
      - ' '
      - '<dark_purple>{{locked}}'
  unlocked_ability:
    material: amethyst_shard
    display_name: '<light_purple>{name}'
    lore:
      - component: your_level
      - component: your_level_maxed
      - ' '
      - component: unlocked_desc
      - component: unlocked_desc_maxed
      - ' '
      - '<green>{{unlocked}}'
  unlocked_mana_ability:
    pos: 2,4
    material: nether_star
    display_name: '<light_purple>{name}'
    lore:
      - component: your_level
      - component: your_level_maxed
      - ' '
      - component: unlocked_desc
      - component: unlocked_desc_maxed
      - ' '
      - '<light_purple>{{unlocked}}'
components:
  your_level:
    context: AbstractAbility
    lore:
      - '<white>{{your_level}}: <aqua>{level}'
  your_level_maxed:
    context: AbstractAbility
    lore:
      - '<white>{{your_level}}: <aqua>{level} <gold>(MAXED)'
  unlocked_desc:
    context: AbstractAbility
    lore:
      - text: '{{next_upgrade_at}}'
        styles:
          1: '<white>'
          2: '<dark_aqua>'
      - text: '{desc}'
        wrap: true
        wrap_indent: '  '
        styles:
          0: '<gray>'
          1: '<yellow>'
  unlocked_desc_maxed:
    context: AbstractAbility
    lore:
      - '<white>{{description}}:'
      - text: '{desc}'
        wrap: true
        wrap_indent: '  '
        styles:
          0: '<gray>'
          1: '<yellow>'
formats:
  desc_upgrade_value: '<gray>{current}<dark_gray>→{next}<gray>'