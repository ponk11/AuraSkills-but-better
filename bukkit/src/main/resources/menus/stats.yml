title: '{{stats_title}}'
size: 6
fill:
  enabled: true
  material: purple_stained_glass_pane
items:
  skull:
    pos: 0,4
    material: player_head
    display_name: '<yellow>{player}'
    lore:
      - '{entries[\n]}'
  back:
    material: arrow
    pos: 5,0
    display_name: '<green>{{back}}'
    lore:
      - '<gray>{{back_click}}'
templates:
  stat:
    contexts:
      strength: {group: upper_left, order: 1, material: crimson_nylium}
      health: {group: upper_left, order: 2, material: redstone_block}
      regeneration: {group: upper_left, order: 3, material: golden_apple}
      luck: {group: upper_right, order: 1, material: emerald_block}
      wisdom: {group: upper_right, order: 2, material: amethyst_block}
      toughness: {group: upper_right, order: 3, material: obsidian}
      crit_chance: {group: lower, order: 1, material: pointed_dripstone}
      crit_damage: {group: lower, order: 2, material: netherite_sword}
      speed: {group: lower, order: 3, material: feather}
    groups:
      upper_left:
        start: 2,0
        end: 2,3
        align: right
      upper_right:
        start: 2,5
        end: 2,8
        align: left
      lower:
        start: 3,0
        end: 3,8
        align: center
    display_name: '<light_purple><bold>{color}{stat}</bold>'
    lore:
      - text: '{stat_desc}'
        wrap: true
        style: '<gray>'
      - component: leveled_by
      - ' '
      - '<gray>{{your_level}}: {color}{level}'
      - ' '
      - '{traits[\n]}'
      - ' '
      - '<light_purple>{{stat_info_click}}'
components:
  leveled_by:
    context: Stat
    lore:
      - ' '
      - text: '<1>{{skills}}: <2>{skills[, ]}'
        wrap: true
        styles:
          1: '<gray>'
          2: '<white>'
formats:
  player_stat_entry: '{color}{symbol} {stat} <white>{level}'
  trait_entry: '<#d0d0d0>{trait}: {color}{level}'
  luck_trait_desc_chance: ' <dark_gray>({chance})'
  luck_trait_desc_added: ' <dark_gray>({added})'
  luck_trait_desc_both: ' <dark_gray>({added}, {chance})'